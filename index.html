body.tp-cine #sonar { opacity: 0 !important; }
#sonar { transition: opacity .6s ease; }
#tp-hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-family: Georgia, 'Times New Roman', serif; color: #e9e4d8; }
#tp-line { position: absolute; left: 50%; bottom: 148px; transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center;
  opacity: 0; transition: opacity .5s ease; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.6); }
#tp-hud.cine #tp-line { bottom: calc(11vh + 18px); transition: opacity .25s ease; }
#tp-line .who { display: block; font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .32em; color: #c9b892; margin-bottom: 7px; }
#tp-line .who.nora { color: #b9d2a6; } #tp-line .who.voss, #tp-line .who.deakin, #tp-line .who.gwen { color: #c7a3a0; } #tp-line .who.radio { color: #9fb7c4; }
#tp-line .say { font-style: italic; font-size: clamp(16px, 2.1vw, 21px); line-height: 1.35; }
#tp-bars::before, #tp-bars::after { content: ''; position: absolute; left: 0; right: 0; height: 11vh; background: #000; transition: transform .7s ease; }
#tp-bars::before { top: 0; transform: translateY(-100%); } #tp-bars::after { bottom: 0; transform: translateY(100%); }
#tp-hud.cine #tp-bars::before, #tp-hud.cine #tp-bars::after { transform: none; }
#tp-skip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(11vh - 30px); font: 12px/1 ui-sans-serif, system-ui, sans-serif;
  color: rgba(220,232,234,.55); letter-spacing: .08em; opacity: 0; transition: opacity .6s ease; }
#tp-hud.cine #tp-skip { opacity: 1; }
#tp-skip kbd { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; padding: 3px 5px; border-radius: 3px; border: 1px solid rgba(220,232,234,.35); margin: 0 3px; }
#tp-chapter { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0; transition: opacity 1s ease; }
#tp-chapter.on { opacity: 1; }
#tp-chapter .num { font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .5em; color: #8fb3b5; }
#tp-chapter .name { font-size: clamp(30px, 5vw, 54px); letter-spacing: .28em; color: #e9e4d8; text-indent: .28em; }
#tp-obj { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; max-width: min(380px, 70vw); padding: 10px 14px 11px; border-left: 2px solid #c9b892;
  background: linear-gradient(90deg, rgba(6,16,20,.7), rgba(6,16,20,0)); opacity: 0; transition: opacity .6s ease, transform .6s ease; transform: translateY(-6px); }
#tp-obj.on { opacity: 1; transform: none; }
#tp-hud.cine #tp-obj { opacity: 0; }
#tp-obj .hd { font: 600 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .3em; color: #c9b892; margin-bottom: 6px; }
#tp-obj .tx { font: 14px/1.35 ui-sans-serif, system-ui, sans-serif; color: #e3ecec; }
#tp-obj .pr { margin-top: 7px; display: flex; gap: 4px; }
#tp-obj .pr i { width: 14px; height: 4px; border-radius: 2px; background: rgba(220,232,234,.22); }
#tp-obj .pr i.on { background: #f3dc9b; }
#tp-obj .pr span { font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; color: #f3dc9b; font-variant-numeric: tabular-nums; }
#tp-obj.done .tx { text-decoration: line-through; text-decoration-color: rgba(243,220,155,.7); color: #b8c6c6; }
#tp-hint { position: absolute; left: 50%; bottom: calc(var(--tp-strip, 118px) + 22px); transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
  font: 13px/1 ui-sans-serif, system-ui, sans-serif; color: #f3dc9b; opacity: 0; transition: opacity .2s ease; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
#tp-hint.on { opacity: 1; }
#tp-hint kbd { font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; padding: 4px 7px; border-radius: 4px; background: #f3dc9b; color: #0b1a1f; }
#tp-hud.cine #tp-hint { opacity: 0; }
#tp-arms { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: none; gap: 10px; align-items: center;
  font: 600 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; color: #9fb2b4; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
#tp-arms.on { display: flex; }
#tp-hud.cine #tp-arms { display: none; }
#tp-arms .w { padding: 6px 9px; border-radius: 5px; border: 1px solid rgba(220,236,238,.18); background: rgba(6,16,20,.55); }
#tp-arms .w.sel { color: #f3dc9b; border-color: rgba(243,220,155,.6); }
#tp-arms .w.sel.pistol { color: #f0a58a; border-color: rgba(240,165,138,.65); }
#tp-arms .w b { font-variant-numeric: tabular-nums; margin-left: 6px; }

fade",to:1,dur:2}]},"trail-brief":{id:"trail-brief",steps:[{do:"fade",to:1,dur:.01},{do:"fill",v:.2},{do:"orca",x:30,y:4,heading:0,swim:[0,0]},{do:"actor",id:"nora",kind:"nora",x:19,y:-1.3,face:1,prop:"notebook",pose:"hold"},{do:"actor",id:"landon",kind:"landon",x:25,y:-1.3,face:-1},{do:"cam",x:24,y:-1,zoom:13},{do:"fade",to:0,dur:1.2},{do:"say",who:"NORA",text:"Gate camera has the truck out at 3:40."},{do:"say",who:"NORA",text:"Port gate logs it in at 5:52."},{do:"say",who:"LANDON",text:"It’s a ten-minute drive."},{do:"say",who:"NORA",text:"So they stopped on the water. Transferred him."},{do:"set",id:"landon",face:1},{do:"say",who:"LANDON",text:"And dropped things. They always drop things."},{do:"cam",x:40,y:8,zoom:30,dur:2}]},"not-whale-shaped":{id:"not-whale-shaped",steps:[{do:"fill",v:.3},{do:"orca",x:440,y:12,heading:0,swim:[0,0]},{do:"actor",id:"crane",kind:"crane",x:500,y:-3.5,arg:0},{do:"actor",id:"crate",kind:"crate",x:432,y:-12.5},{do:"cam",x:450,y:-8,zoom:34,dur:2},{do:"sound",name:"crane"},{do:"move",id:"crate",x:432,y:-6.4,dur:5,async:!0},{do:"move",id:"crane",x:500,dur:5,argTo:.4},{do:"cam",x:24,y:-1.5,zoom:12},{do:"actor",id:"nora",kind:"nora",x:20,y:-1.3,face:1,prop:"binoculars"},{do:"actor",id:"landon",kind:"landon",x:25,y:-1.3,face:1},{do:"say",who:"NORA",text:"The Ballast. She’s not on the port schedule this week."},{do:"say",who:"LANDON",text:"Look at the crane."},{do:"say",who:"NORA",text:"That’s one of ours. That’s our stencil on the side."},{do:"wait",dur:1.2},{do:"say",who:"LANDON",text:"Too long for him."},{do:"say",who:"LANDON",text:"And they’re rigging it like it weighs four tons."},{do:"say",who:"NORA",text:"Then what’s in it?"},{do:"wait",dur:1.6},{do:"say",who:"LANDON",text:"Whatever it is, it’s travelling on his transfer form."},{do:"say",who:"NORA",text:"I know someone at the paper."},{do:"say",who:"LANDON",text:"Not yet."},{do:"say",who:"NORA",text:"Landon."},{do:"say",who:"LANDON",text:"Not until we know where he is."},{do:"fade",to:1,dur:1.6}]},"quiet-intro":{id:"quiet-intro",steps:[{do:"fade",to:1,dur:.01},{do:"title",chapter:"III",name:"PERSONAL"},{do:"orca",x:222,y:5,heading:Math.PI,swim:[0,0]},{do:"actor",id:"nora",kind:"nora",x:209,y:-1.3,face:-1,pose:"sit",prop:"notebook"},{do:"actor",id:"landon",kind:"landon",x:215,y:-1.3,face:-1},{do:"cam",x:212,y:-1,zoom:14},{do:"fade",to:0,dur:1.5},{do:"say",who:"NORA",text:"Day five. They came back in on the morning tide."},{do:"say",who:"NORA",text:"Hook first. Then Ladder."},{do:"sound",name:"podcalls"},{do:"wait",dur:1.5},{do:"say",who:"LANDON",text:"Go on, then."},{do:"cam",x:200,y:8,zoom:32,dur:2}]},"quiet-week":{id:"quiet-week",steps:[{do:"fade",to:1,dur:1.2},{do:"orca",x:220,y:3,heading:Math.PI,swim:[0,0]},{do:"pod",near:[120,14],spread:9},{do:"actor",id:"nora",kind:"nora",x:209,y:-1.3,face:1,pose:"sit",prop:"notebook"},{do:"actor",id:"landon",kind:"landon",x:215,y:-1.3,face:-1,pose:"sit"},{do:"cam",x:212,y:-1,zoom:13},{do:"fill",v:.1},{do:"fade",to:0,dur:1.5},{do:"say",who:"NORA",text:"Day six. She brought a yearling into the kelp. Not hers."},{do:"say",who:"NORA",text:"Kept herself between it and open water all afternoon."},{do:"say",who:"LANDON",text:"She’s practicing."},{do:"wait",dur:1.4},{do:"say",who:"NORA",text:"You talk about her like she’s a person."},{do:"say",who:"LANDON",text:"She’s not a personality. She’s a person with a personality."},{do:"wait",dur:1},{do:"say",who:"NORA",text:"Write that down, Grey."},{do:"wait",dur:2},{do:"set",id:"nora",prop:"folder"},{do:"say",who:"NORA",text:"I ran the code off his transfer form."},{do:"say",who:"NORA",text:"O.R.C.A. It’s a federal designation."},{do:"say",who:"NORA",text:"“Operation: Residual Cargo Corridor Assessment.”"},{do:"say",who:"LANDON",text:"A shipping lane."},{do:"say",who:"NORA",text:"A lane nobody inspects. Who opens a crate with a whale in it?"},{do:"say",who:"LANDON",text:"What rides with them?"},{do:"say",who:"NORA",text:"Two serial numbers on the Ballast’s list. If I photograph those crates, it’s a case."},{do:"say",who:"LANDON",text:"Then I go."},{do:"say",who:"NORA",text:"They know your face. Nobody looks twice at the vet."},{do:"say",who:"LANDON",text:"Not yet."},{do:"wait",dur:1.6},{do:"set",id:"nora",prop:null,face:-1},{do:"say",who:"NORA",text:"Eight years ago I signed a relocation. A female. Sanctuary transfer."},{do:"wait",dur:1.4},{do:"say",who:"NORA",text:"There was no sanctuary."},{do:"wait",dur:2},{do:"say",who:"NORA",text:"My case. My call."},{do:"wait",dur:1.8},{do:"say",who:"LANDON",text:"Ten o’clock. On the radio."},{do:"say",who:"NORA",text:"Ten o’clock."},{do:"orca",swim:[.3,-.3]},{do:"wait",dur:1},{do:"orca",swim:[0,0],roll:!0},{do:"wait",dur:2.4},{do:"fade",to:1,dur:2}]},"berth-intro":{id:"berth-intro",steps:[{do:"fade",to:1,dur:.01},{do:"fill",v:.3},{do:"orca",x:34,y:4,heading:0,swim:[0,0]},{do:"actor",id:"landon",kind:"landon",x:23,y:-1.3,face:1,prop:"radio",pose:"hold"},{do:"cam",x:24,y:-1.5,zoom:12},{do:"fade",to:0,dur:1.5},{do:"sound",name:"static"},{do:"say",who:"LANDON",text:"Nora. Come in."},{do:"wait",dur:2},{do:"sound",name:"static"},{do:"say",who:"LANDON",text:"Nora, it’s ten-twenty."},{do:"wait",dur:2.4},{do:"say",who:"LANDON",text:"Nora."},{do:"wait",dur:1.6},{do:"set",id:"landon",prop:null,pose:"stand"},{do:"wait",dur:1.2},{do:"cam",x:50,y:10,zoom:32,dur:2}]},harbor:{id:"harbor",steps:[{do:"fade",to:1,dur:1.5},{do:"orca",hide:!0},{do:"fill",v:.45},{do:"actor",id:"police",kind:"police",x:516,y:-3.5},{do:"actor",id:"gurney",kind:"gurney",x:507,y:-3.5},{do:"actor",id:"bag",kind:"bodybag",x:507,y:-4.4},{do:"actor",id:"b1",kind:"bystander",x:512,y:-3.5,face:-1},{do:"actor",id:"b2",kind:"bystander",x:513.4,y:-3.5,face:-1},{do:"actor",id:"officer",kind:"officer",x:504,y:-3.5,face:1},{do:"actor",id:"landon",kind:"landon",x:519,y:-3.5,face:-1},{do:"cam",x:509,y:-5,zoom:12},{do:"sound",name:"siren"},{do:"fade",to:0,dur:2},{do:"move",id:"landon",x:509.5,dur:3.5},{do:"say",who:"OFFICER",text:"Sir. Behind the tape, please."},{do:"say",who:"OFFICER",text:"You know her?"},{do:"wait",dur:1.6},{do:"say",who:"LANDON",text:"She’s the vet. At the aquarium."},{do:"say",who:"OFFICER",text:"Looks like she went in off the quay. Happens more than you’d think."},{do:"say",who:"LANDON",text:"She’s been on boats twenty years."},{do:"say",who:"OFFICER",text:"Then it happens to people who’ve been on boats twenty years."},{do:"wait",dur:.8},{do:"say",who:"OFFICER",text:"Step back, sir."},{do:"wait",dur:2},{do:"fade",to:1,dur:1.5},{do:"remove",id:"police"},{do:"remove",id:"gurney"},{do:"remove",id:"bag"},{do:"remove",id:"b1"},{do:"remove",id:"b2"},{do:"remove",id:"officer"},{do:"actor",id:"landon",kind:"landon",x:24,y:-1.3,face:-1,pose:"kneel"},{do:"actor",id:"case",kind:"case",x:21.5,y:-1.3,pose:"down"},{do:"cam",x:23,y:-1.5,zoom:10},{do:"fill",v:.25},{do:"fade",to:0,dur:2},{do:"sound",name:"thump"},{do:"wait",dur:3.5},{do:"say",who:"NORA (RECORDING)",text:"Day nine. If they ever come to the boat, it won’t be for us."},{do:"wait",dur:1.2},{do:"say",who:"NORA (RECORDING)",text:"It’ll be for her."},{do:"wait",dur:2.2},{do:"set",id:"landon",prop:"notebook",pose:"hold"},{do:"say",who:"NORA (NOTEBOOK)",text:"Juno. Adult female. Relocation approved, sanctuary transfer. N. Vance."},{do:"say",who:"NORA (NOTEBOOK)",text:"Routing: O.R.C.A."},{do:"wait",dur:2.4},{do:"set",id:"landon",prop:null,pose:"kneel"},{do:"wait",dur:1.5}]},bridge:{id:"bridge",steps:[{do:"orca",show:!0,x:34,y:2.5,heading:Math.PI,swim:[0,0]},{do:"actor",id:"landon",kind:"landon",x:24,y:-1.3,face:1},{do:"cam",x:30,y:-1,zoom:26,dur:2},{do:"orca",call:!0},{do:"wait",dur:2.5},{do:"sound",name:"podcalls"},{do:"actor",id:"p1",kind:"orcaSil",x:44,y:0,face:-1,arg:0},{do:"wait",dur:.8},{do:"actor",id:"p2",kind:"orcaSil",x:10,y:0,face:1,arg:0},{do:"actor",id:"p3",kind:"orcaSil",x:50,y:0,face:-1,arg:-1},{do:"wait",dur:1.2},{do:"actor",id:"p4",kind:"orcaSil",x:3,y:0,face:1,arg:-.5},{do:"wait",dur:3},{do:"wait",dur:3},{do:"fade",to:1,dur:2}]},"ballast-intro":{id:"ballast-intro",steps:[{do:"fade",to:1,dur:.01},{do:"fill",v:.3},{do:"cam",x:80,y:-11,zoom:34},{do:"actor",id:"landon",kind:"landon",x:2,y:-3.5,face:1},{do:"fade",to:0,dur:2},{do:"wait",dur:1.5},{do:"cam",x:9,y:-5,zoom:11,dur:3},{do:"move",id:"landon",x:9,dur:3},{do:"set",id:"landon",pose:"hold"},{do:"wait",dur:1.2},{do:"say",who:"LANDON",text:"Ten o’clock."},{do:"wait",dur:1.6},{do:"set",id:"landon",pose:"stand"},{do:"wait",dur:.6},{do:"remove",id:"landon"}]},gwen:{id:"gwen",steps:[{do:"fill",v:.35},{do:"actor",id:"gwen",kind:"gwen",x:107.5,y:-13.5,face:1,pose:"sit"},{do:"actor",id:"landon",kind:"landon",x:112.2,y:-13.5,face:-1},{do:"cam",x:109.5,y:-15.4,zoom:9,dur:1.2},{do:"say",who:"GWEN",text:"Landon."},{do:"wait",dur:1},{do:"say",who:"GWEN",text:"I heard. About Nora. I’m sorry."},{do:"say",who:"LANDON",text:"Twenty-two forty. Debris in the water."},{do:"say",who:"GWEN",text:"I wasn’t on board."},{do:"say",who:"LANDON",text:"You signed him onto this ship."},{do:"say",who:"GWEN",text:"I signed a transfer. I’ve signed forty."},{do:"say",who:"GWEN",text:"They keep the lights on for two hundred animals."},{do:"say",who:"LANDON",text:"There’s no partner facility."},{do:"say",who:"GWEN",text:"There’s a facility. I’ve seen the brochure."},{do:"wait",dur:1.4},{do:"branch",cond:"loud",then:[{do:"set",id:"landon",pose:"hold"},{do:"say",who:"GWEN",text:"I heard the shots."},{do:"say",who:"GWEN",text:"Is that what you came here to do?"},{do:"wait",dur:2.6},{do:"set",id:"landon",pose:"stand"}],else:[{do:"say",who:"GWEN",text:"What do you want? Your job back?"},{do:"say",who:"LANDON",text:"Where is he?"},{do:"say",who:"GWEN",text:"Somewhere better than a tank."},{do:"wait",dur:2}]},{do:"say",who:"LANDON",text:"Go home, Gwen."},{do:"wait",dur:1},{do:"set",id:"gwen",pose:"stand"},{do:"move",id:"gwen",x:112.6,dur:2.2},{do:"remove",id:"gwen"},{do:"wait",dur:1.2},{do:"move",id:"landon",x:108.5,dur:2},{do:"set",id:"landon",pose:"sit"},{do:"wait",dur:2.2},{do: :root { --m-abyss: #04141a; --m-glass: #9fd6e0; --m-bone: #ece6d6; --m-kelp: #c9b892; --m-dim: #7f9da1; }
.tp-menu { position: fixed; inset: 0; z-index: 8; display: none; color: var(--m-bone); font-family: Georgia, 'Times New Roman', serif;
  -webkit-user-select: none; user-select: none; }
.tp-menu.on { display: block; }
#tp-menu { background: linear-gradient(90deg, rgba(4,20,26,.86) 0%, rgba(4,20,26,.62) 34%, rgba(4,20,26,0) 68%); }
#tp-pause { background: rgba(4,20,26,.6); -webkit-backdrop-filter: blur(6px) saturate(.7); backdrop-filter: blur(6px) saturate(.7); z-index: 9; }
.tp-col { position: absolute; left: calc(max(28px, 7vw) + env(safe-area-inset-left, 0px)); top: 0; bottom: 0; width: min(440px, 80vw);
  display: flex; flex-direction: column; justify-content: center; gap: 4px; }

/* the wordmark */
.tp-mark { position: relative; font-size: clamp(42px, 8.4vw, 108px); line-height: 1; letter-spacing: .16em; margin-left: -.04em; white-space: nowrap; }
.tp-mark span { display: inline-block; opacity: 0; color: var(--m-glass); text-shadow: 0 0 22px rgba(159,214,224,.9);
  animation: tp-echo 1.6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(.35s + var(--i) * .1s); }
@keyframes tp-echo {
  0% { opacity: 0; transform: translateY(.06em); filter: blur(6px); }
  18% { opacity: 1; filter: blur(0); color: #e9fbff; text-shadow: 0 0 26px rgba(159,214,224,1); }
  100% { opacity: 1; transform: none; color: var(--m-bone); text-shadow: 0 0 0 rgba(159,214,224,0); }
}
.tp-ring { position: absolute; left: -.2em; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; pointer-events: none;
  border: 2px solid rgba(159,214,224,.9); opacity: 0; animation: tp-ring 1.9s cubic-bezier(.25,.6,.3,1) .2s forwards; }
.tp-ring.two { border-width: 1px; animation-delay: .38s; }
@keyframes tp-ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(150); } }
.tp-sub { font-style: italic; color: var(--m-kelp); font-size: clamp(14px, 1.6vw, 18px); margin: 14px 0 0 2px; opacity: 0; animation: tp-in .9s ease 1.35s forwards; }
.tp-body { margin-top: clamp(22px, 7vh, 64px); opacity: 0; animation: tp-in .9s ease 1.6s forwards; position: relative; }
@keyframes tp-in { to { opacity: 1; } }

/* items */
.tp-list { display: flex; flex-direction: column; align-items: flex-start; position: relative; }
.tp-item { appearance: none; background: none; border: 0; padding: 7px 0 7px 34px; margin: 0; cursor: pointer; text-align: left; color: var(--m-bone);
  font: 400 clamp(19px, 2.2vw, 24px)/1.15 Georgia, 'Times New Roman', serif; opacity: .72; transition: opacity .2s ease; touch-action: manipulation; }
.tp-item small { display: block; font: 13px/1.3 ui-sans-serif, system-ui, sans-serif; color: var(--m-kelp); margin-top: 3px; opacity: .9; }
.tp-item:hover, .tp-item:focus-visible, .tp-item.cur { opacity: 1; outline: none; }
.tp-item[disabled] { opacity: .3; cursor: default; }
.tp-glyph { position: absolute; left: 0; top: 0; width: 22px; height: 22px; color: var(--m-glass); pointer-events: none; opacity: 0;
  transition: transform .26s cubic-bezier(.3,.7,.3,1), opacity .2s ease; }
.tp-glyph.on { opacity: 1; }
.tp-back { font-size: 15px; padding-left: 34px; color: var(--m-dim); }
.tp-head { font-size: clamp(30px, 4vw, 44px); margin: 0 0 4px; font-weight: 400; }
.tp-meta { color: var(--m-kelp); font-style: italic; font-size: 15px; margin: 0 0 18px; }
.tp-panel { display: none; } .tp-panel.on { display: block; }
.tp-panel.scroll { max-height: 62vh; overflow-y: auto; padding-right: 8px; }

/* settings */
.tp-set { display: grid; grid-template-columns: minmax(130px, auto) 1fr; align-items: center; gap: 12px 18px; padding-left: 34px; margin: 6px 0 14px;
  font: 15px/1.3 ui-sans-serif, system-ui, sans-serif; color: var(--m-bone); }
.tp-set input[type=range] { width: 100%; accent-color: var(--m-glass); }
.tp-set .tog { justify-self: start; appearance: none; border: 1px solid rgba(236,230,214,.35); background: none; color: var(--m-bone); border-radius: 14px;
  padding: 6px 14px; font: 13px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; min-width: 64px; }
.tp-set .tog[aria-pressed=true] { background: var(--m-glass); color: var(--m-abyss); border-color: var(--m-glass); }
.tp-set .danger { justify-self: start; appearance: none; background: none; border: 1px solid rgba(214,140,120,.6); color: #e8b3a4; border-radius: 6px; padding: 7px 12px;
  font: 13px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
.tp-set :focus-visible, .tp-item:focus-visible small { outline: 2px solid var(--m-glass); outline-offset: 2px; }
.tp-ver { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font: 12px/1 ui-sans-serif, system-ui, sans-serif; color: rgba(236,230,214,.4); }
.tp-hint { margin-top: 26px; padding-left: 34px; font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; color: var(--m-dim); }
body.tp-touch .tp-hint { display: none; }

@media (max-height: 520px) {
  .tp-mark { font-size: clamp(34px, 7vw, 60px); }
  .tp-sub { margin-top: 6px; }
  .tp-body { margin-top: 14px; }
  .tp-item { padding-top: 5px; padding-bottom: 5px; font-size: 18px; }
  .tp-item small { display: none; }
  .tp-panel.scroll { max-height: 56vh; }
  .tp-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tp-mark span, .tp-sub, .tp-body { animation: none; opacity: 1; color: var(--m-bone); text-shadow: none; }
  .tp-ring { display: none; }
  .tp-glyph { transition: none; }
}
